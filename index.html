<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QRPass – Dynamic QR Access Manager</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234f46e5'/%3E%3Cpath d='M6 6h5v5H6zM13 6h5v5h-5zM6 13h5v5H6zM13 13h2v2h-2zM16 16h2v2h-2z' fill='white'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{--bg:#f4f5fb;--card:#fff;--text:#14142b;--muted:#6b6f8a;--line:#e6e8f2;--brand:#4f46e5;--brand2:#6d68f0;--soft:#eef0ff;--ok:#16a34a;--okb:#e3f6ea;--warn:#d97706;--warnb:#fdf0dc;--bad:#dc2626;--badb:#fde7e7;--info:#2563eb;--infob:#e3ecfd;--idle:#64748b;--idleb:#eceff4;--side:#1b1a55;--input:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1020;--card:#181a33;--text:#eceefb;--muted:#9a9eb8;--line:#2a2d4d;--soft:#22254a;--okb:#12301f;--warnb:#3a2a0f;--badb:#3d1618;--infob:#14264a;--idleb:#23273a;--input:#12142b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1020;--card:#181a33;--text:#eceefb;--muted:#9a9eb8;--line:#2a2d4d;--soft:#22254a;--okb:#12301f;--warnb:#3a2a0f;--badb:#3d1618;--infob:#14264a;--idleb:#23273a;--input:#12142b;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
aside{background:linear-gradient(180deg,#201f66,#15143f);color:#c9cbf3;padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.logo{display:flex;gap:10px;align-items:center;padding:4px 8px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.logo b{display:block;color:#fff;font-size:17px;line-height:1.1}.logo small{font-size:10px;letter-spacing:.16em;color:#8f92d6}
.logo i{width:36px;height:36px;border-radius:10px;background:var(--brand);display:grid;place-items:center;color:#fff}
.sec{font-size:10px;letter-spacing:.16em;color:#7e81c4;margin:20px 10px 8px}
nav button{all:unset;box-sizing:border-box;width:100%;display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;cursor:pointer;color:#c9cbf3;font-weight:500;margin-bottom:2px}
nav button:hover{background:rgba(255,255,255,.06)}nav button.on{background:rgba(99,102,241,.28);color:#fff;box-shadow:inset 0 0 0 1px rgba(129,132,255,.45)}
.side-foot{margin-top:auto;padding:12px 10px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:#8f92d6;display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:#64748b;flex:none}.dot.on{background:#22c55e}
main{min-width:0}
.top{display:flex;align-items:center;gap:14px;padding:14px 28px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.crumb{color:var(--muted)}.crumb b{color:var(--text)}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:8px 14px;color:var(--muted)}
.search input{border:0;background:none;outline:0;color:var(--text);flex:1;font:inherit}
.sp{flex:1}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);display:grid;place-items:center;cursor:pointer}
.content{padding:24px 28px 40px;max-width:1400px}
.hero{background:linear-gradient(120deg,#4338ca,#6d68f0);color:#fff;border-radius:18px;padding:26px 28px;display:flex;gap:20px;justify-content:space-between;align-items:center;flex-wrap:wrap;box-shadow:0 10px 30px rgba(79,70,229,.25)}
.hero h1{margin:0 0 4px;font-size:24px}.hero p{margin:0;opacity:.9}
.chips{display:flex;gap:10px;flex-wrap:wrap}.chip{background:rgba(255,255,255,.17);border-radius:12px;padding:10px 16px;min-width:104px}
.chip b{display:block;font-size:22px}.chip span{font-size:12px;opacity:.85}
.grid{display:grid;gap:16px;margin-top:16px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1.5fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 1px 2px rgba(20,20,60,.03)}
.stat{display:flex;justify-content:space-between;gap:10px}.stat small{letter-spacing:.08em;font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase}
.stat b{display:block;font-size:30px;margin:6px 0 2px;line-height:1.1}.stat span{color:var(--muted);font-size:12px}
.ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.c-ok{background:var(--okb);color:var(--ok)}.c-warn{background:var(--warnb);color:var(--warn)}.c-bad{background:var(--badb);color:var(--bad)}.c-info{background:var(--infob);color:var(--info)}.c-brand{background:var(--soft);color:var(--brand)}.c-idle{background:var(--idleb);color:var(--idle)}
h2{margin:0 0 14px;font-size:16px;display:flex;gap:8px;align-items:center}
.bars{display:flex;align-items:flex-end;gap:14px;height:190px;padding:10px 4px 0;border-bottom:1px solid var(--line)}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:6px;font-size:12px;color:var(--muted)}
.bar i{width:100%;max-width:46px;background:var(--brand);border-radius:8px 8px 0 0;min-height:3px}
.lbls{display:flex;gap:14px;padding:6px 4px;color:var(--muted);font-size:12px}.lbls span{flex:1;text-align:center}
.donut{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.legend div{display:flex;gap:8px;align-items:center;margin:6px 0}.legend i{width:10px;height:10px;border-radius:3px}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border-bottom:0}
.wrap{overflow-x:auto}.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
.badge:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.btn{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}.btn.sm{padding:6px 9px}.btn.d{color:var(--bad)}
.btn:hover{filter:brightness(.97)}
.acts{display:flex;gap:6px;justify-content:flex-end}
.form{display:grid;grid-template-columns:1fr 1fr;gap:16px}.form .full{grid-column:1/-1}
label{display:block;font-weight:600;font-size:12.5px;margin-bottom:6px}
input,select,textarea{width:100%;background:var(--input);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
textarea{min-height:120px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.row{display:flex;gap:8px}.hint{color:var(--muted);font-size:12px;margin-top:5px}
.tools{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}.tools input,.tools select{max-width:260px}
pre{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto;font-size:12px;margin:8px 0}
.modal{position:fixed;inset:0;background:rgba(10,10,30,.55);display:grid;place-items:center;z-index:20;padding:16px}
.mbox{background:var(--card);border-radius:18px;padding:24px;width:min(380px,100%);text-align:center}
.qrbox{background:#fff;padding:14px;border-radius:14px;display:inline-block;margin:10px 0;border:1px solid var(--line)}
.res{text-align:center;padding:28px}.res .ico{width:72px;height:72px;margin:0 auto 12px;border-radius:50%}.res h3{font-size:22px;margin:4px 0}
.dl{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;text-align:left;max-width:380px;margin:16px auto 0}.dl dt{color:var(--muted)}.dl dd{margin:0;font-weight:600}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#1b1a55;color:#fff;padding:10px 18px;border-radius:10px;z-index:30}
.empty{text-align:center;color:var(--muted);padding:30px}
@media(max-width:1000px){.g4{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
.pub aside,.pub .top{display:none}.pub .app{grid-template-columns:1fr}.pub .content{padding-top:40px}
@media(max-width:800px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:10px}
.logo{border:0;padding:0 10px 0 0}.sec,.side-foot{display:none}nav{display:flex;gap:4px}nav button{white-space:nowrap;width:auto}
.top{padding:12px 16px}.content{padding:16px}.form{grid-template-columns:1fr}.search{display:none}}
</style>
</head>
<body>
<div class="app">
<aside>
 <div class="logo"><i id="lg"></i><div><b>QRPass</b><small>ACCESS MANAGER</small></div></div>
 <div class="sec">MAIN</div>
 <nav id="nav"></nav>
 <div class="side-foot"><span class="dot" id="fbdot"></span><span id="fbtxt">Local storage</span></div>
</aside>
<main>
 <div class="top"><div class="crumb">QRPass &rsaquo; <b id="crumb">Dashboard</b></div>
  <label class="search" style="margin:0"><span id="sico"></span><input id="gs" placeholder="Search name, code, invoice..."></label>
  <div class="sp"></div><button class="iconbtn" id="theme" title="Toggle theme"></button></div>
 <div class="content" id="view"></div>
</main>
</div>
<div id="overlay"></div>
<script>
const I={lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',dash:'<rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/>',
qr:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h3M20 17v4"/>',
list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',plus:'<path d="M12 5v14M5 12h14"/>',
shield:'<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/>',
plug:'<path d="M9 2v6M15 2v6M6 8h12v4a6 6 0 0 1-12 0zM12 18v4"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
alert:'<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/>',
check:'<path d="M20 6 9 17l-5-5"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',dl:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',
trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
ban:'<circle cx="12" cy="12" r="9"/><path d="m5.6 5.6 12.8 12.8"/>',cloud:'<path d="M7 18a5 5 0 0 1-.6-9.96A6 6 0 0 1 18 9a4.5 4.5 0 0 1-.5 9z"/>',
eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',moon:'<path d="M20 14A8 8 0 0 1 10 4a8 8 0 1 0 10 10z"/>',
refresh:'<path d="M20 11a8 8 0 0 0-14-4L4 9M4 4v5h5M4 13a8 8 0 0 0 14 4l2-2M20 20v-5h-5"/>',
file:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M9 13h6M9 17h6"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/>'};
const ic=(n,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NAV=[['dashboard','Dashboard','dash'],['codes','QR Codes','list'],['create','Generate QR','plus'],['verify','Verify','shield'],['integrations','Integrations','plug']];
/* PASTE YOUR FIREBASE CONFIG BETWEEN THE BRACES BELOW, REPLACING null */
const EMBED_FB={apiKey:"AIzaSyA1FBqm-Hmq1mebjFSVpU1CPamAcV8pfLU",authDomain:"ugramm-qr.firebaseapp.com",projectId:"ugramm-qr",storageBucket:"ugramm-qr.firebasestorage.app",messagingSenderId:"888546337684",appId:"1:888546337684:web:d97e522a79eb4ae03ba581"};
const PUBLIC_URL='';
const LOCK_HASH='4yqr2yk7ea';
let unlocked=false,vwait=false;
const h53=s=>{let a=0xdeadbeef,b=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return (4294967296*(2097151&b)+(a>>>0)).toString(36)};
function tryUnlock(){const v=$('#lp').value;if(h53('qrp|'+v)===LOCK_HASH){unlocked=true;document.activeElement.blur();render()}else{toast('Incorrect password');$('#lp').value=''}}
let codes=[],view='dashboard',q='',fbcfg=null,db=null,vcode='';
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const toMs=v=>typeof v==='number'?v:new Date(v).getTime();
const fmt=t=>new Date(t).toLocaleString(undefined,{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
const status=c=>{const n=Date.now();return c.revoked?'revoked':n<c.start?'upcoming':n>c.end?'expired':'active'};
const ST={active:['Active','c-ok'],upcoming:['Upcoming','c-info'],expired:['Expired','c-idle'],revoked:['Revoked','c-bad']};
const badge=s=>`<span class="badge ${ST[s][1]}">${ST[s][0]}</span>`;
function genCode(){const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let c;do{const r=n=>Array.from({length:n},()=>A[Math.floor(Math.random()*A.length)]).join('');c='QR-'+r(4)+'-'+r(4)}while(codes.some(x=>x.code===c));return c}
function save(){LS.set('qrpass.codes',codes)}
function upsert(rec,remote){const i=codes.findIndex(c=>c.code===rec.code);if(i>=0)codes[i]={...codes[i],...rec};else codes.unshift(rec);save();if(!remote&&db)db.collection('codes').doc(rec.code).set(codes.find(c=>c.code===rec.code)).catch(e=>toast('Cloud write failed'))}
function remove(code){codes=codes.filter(c=>c.code!==code);save();if(db)db.collection('codes').doc(code).delete().catch(()=>{})}
function push(p){const start=toMs(p.start??Date.now()),end=toMs(p.end);if(!p.name||!p.invoice||isNaN(end)||isNaN(start)||end<=start)throw new Error('Invalid record: name, invoice, start and end are required');
 const rec={code:p.code||genCode(),name:String(p.name),invoice:String(p.invoice),start,end,revoked:!!p.revoked,created:Date.now(),scans:0,source:p.source||'api'};upsert(rec);return rec}
window.QRPass={push,list:()=>codes.map(c=>({...c,status:status(c)})),status:code=>{const c=codes.find(x=>x.code===code);return c?status(c):'unknown'}};
window.addEventListener('message',e=>{const d=e.data;if(d&&d.type==='qrpass.push'){try{[].concat(d.payload).forEach(p=>push({...p,source:'plugin'}));render();toast('Received data from plugin')}catch(x){toast(x.message)}}});

function seed(){codes=[];const D=864e5,n=Date.now();const mk=(name,inv,s,e,ago)=>({code:genCode(),name,invoice:inv,start:n+s*D,end:n+e*D,revoked:false,created:n-ago*D,scans:Math.floor(Math.random()*9),source:'sample'});
 codes=[mk('Arjun Mehta','INV-2026-0041',-20,10,20),mk('Priya Nair','INV-2026-0042',-5,25,5),mk('Rahul Verma','INV-2026-0043',-60,-30,60),mk('Sneha Kulkarni','INV-2026-0044',-3,5,35),mk('Karthik Rao','INV-2026-0045',2,32,2),mk('Divya Shetty','INV-2026-0046',-90,-1,95),mk('Imran Khan','INV-2026-0047',-12,18,70)];codes[3].revoked=false;save()}

function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function matches(c){const s=q.toLowerCase();return !s||[c.name,c.code,c.invoice].some(v=>v.toLowerCase().includes(s))}

function dashboard(){
 const cnt={active:0,upcoming:0,expired:0,revoked:0};codes.forEach(c=>cnt[status(c)]++);
 const soon=codes.filter(c=>status(c)==='active'&&c.end-Date.now()<7*864e5).length;
 const mons=[];for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);mons.push({l:d.toLocaleString(undefined,{month:'short'}),m:d.getMonth(),y:d.getFullYear(),n:0})}
 codes.forEach(c=>{const d=new Date(c.created),m=mons.find(x=>x.m===d.getMonth()&&x.y===d.getFullYear());if(m)m.n++});const mx=Math.max(1,...mons.map(m=>m.n));
 const tot=codes.length||1,col={active:'#16a34a',upcoming:'#2563eb',expired:'#94a3b8',revoked:'#dc2626'};let off=0;
 const ring=Object.keys(cnt).map(k=>{const len=cnt[k]/tot*251.3,s=`<circle r="40" cx="55" cy="55" fill="none" stroke="${col[k]}" stroke-width="16" stroke-dasharray="${len} ${251.3-len}" stroke-dashoffset="${-off}" transform="rotate(-90 55 55)"/>`;off+=len;return s}).join('');
 const card=(l,v,s,i,c)=>`<div class="card stat"><div><small>${l}</small><b>${v}</b><span>${s}</span></div><div class="ico ${c}">${ic(i,22)}</div></div>`;
 const rec=codes.filter(matches).slice(0,6).map(c=>`<tr><td><b>${esc(c.name)}</b><div class="hint mono">${esc(c.code)}</div></td><td>${esc(c.invoice)}</td><td>${fmt(c.end)}</td><td>${badge(status(c))}</td></tr>`).join('');
 return `<div class="hero"><div><h1>Welcome back</h1><p>Here is how your QR access codes are performing today.</p></div>
 <div class="chips"><div class="chip"><b>${codes.length}</b><span>Total codes</span></div><div class="chip"><b>${cnt.active}</b><span>Active now</span></div><div class="chip"><b>${soon}</b><span>Expiring soon</span></div><div class="chip"><b>${codes.reduce((a,c)=>a+(c.scans||0),0)}</b><span>Total scans</span></div></div></div>
 <div class="grid g4">${card('Active codes',cnt.active,'Valid right now','check','c-ok')}${card('Upcoming',cnt.upcoming,'Not yet started','clock','c-info')}${card('Expiring in 7 days',soon,'Needs renewal','alert','c-warn')}${card('Expired',cnt.expired,cnt.revoked+' revoked','x','c-idle')}</div>
 <div class="grid g2"><div class="card"><h2>${ic('qr')} Codes created (6 months)</h2><div class="bars">${mons.map(m=>`<div class="bar">${m.n}<i style="height:${m.n/mx*80}%"></i></div>`).join('')}</div><div class="lbls">${mons.map(m=>`<span>${m.l}</span>`).join('')}</div></div>
 <div class="card"><h2>${ic('shield')} Status breakdown</h2><div class="donut"><svg width="130" height="130" viewBox="0 0 110 110"><circle r="40" cx="55" cy="55" fill="none" stroke="var(--line)" stroke-width="16"/>${ring}</svg><div class="legend">${Object.keys(cnt).map(k=>`<div><i style="background:${col[k]}"></i>${ST[k][0]}: <b>${cnt[k]}</b></div>`).join('')}</div></div></div></div>
 <div class="card" style="margin-top:16px"><h2>${ic('file')} Recent codes</h2><div class="wrap"><table><tr><th>Name / Code</th><th>Invoice</th><th>Valid until</th><th>Status</th></tr>${rec||'<tr><td colspan="4" class="empty">No codes yet</td></tr>'}</table></div></div>`}

let filt='all';
function list(){
 const rows=codes.filter(matches).filter(c=>filt==='all'||status(c)===filt).map(c=>`<tr><td><b>${esc(c.name)}</b></td><td class="mono">${esc(c.code)}</td><td>${esc(c.invoice)}</td><td>${fmt(c.start)}</td><td>${fmt(c.end)}</td><td>${badge(status(c))}</td>
 <td><div class="acts"><button class="btn sm" data-a="qr" data-c="${c.code}" title="View QR">${ic('eye',16)}</button><button class="btn sm" data-a="dl" data-c="${c.code}" title="Download">${ic('dl',16)}</button><button class="btn sm" data-a="rev" data-c="${c.code}" title="${c.revoked?'Restore':'Revoke'}">${ic(c.revoked?'refresh':'ban',16)}</button><button class="btn sm d" data-a="del" data-c="${c.code}" title="Delete">${ic('trash',16)}</button></div></td></tr>`).join('');
 return `<div class="card"><div class="tools"><select id="f">${['all','active','upcoming','expired','revoked'].map(s=>`<option value="${s}" ${s===filt?'selected':''}>${s==='all'?'All statuses':ST[s][0]}</option>`).join('')}</select><div class="sp"></div><button class="btn p" data-go="create">${ic('plus',16)} Generate QR</button></div>
 <div class="wrap"><table><tr><th>Name</th><th>Unique code</th><th>Invoice no.</th><th>Start</th><th>End</th><th>Status</th><th></th></tr>${rows||'<tr><td colspan="7" class="empty">No matching codes</td></tr>'}</table></div></div>`}

function create(){
 const pad=n=>String(n).padStart(2,'0'),dt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
 const s=new Date(),e=new Date(Date.now()+30*864e5);
 return `<div class="card" style="max-width:760px"><h2>${ic('plus')} Generate a new QR code</h2><div class="form">
 <div><label>Name</label><input id="n" placeholder="Full name"></div><div><label>Invoice number</label><input id="i" placeholder="INV-2026-0100"></div>
 <div><label>Start date and time</label><input id="s" type="datetime-local" value="${dt(s)}"></div><div><label>End date and time</label><input id="e" type="datetime-local" value="${dt(e)}"></div>
 <div class="full"><label>Unique code</label><div class="row"><input id="c" class="mono" value="${genCode()}"><button class="btn" id="rg" type="button">${ic('refresh',16)} New</button></div><div class="hint">Generated automatically and guaranteed unique. After the end date the code is marked expired automatically.</div></div>
 <div class="full row"><button class="btn p" id="go">${ic('qr',16)} Generate QR code</button></div></div></div>`}

function verify(){return `<div class="card" style="max-width:560px;margin:0 auto"><h2>${ic('shield')} Verify a QR code</h2><div class="row"><input id="vc" class="mono" placeholder="QR-XXXX-XXXX" value="${esc(vcode)}"><button class="btn p" id="vb">Check</button></div><div id="vr">${vcode?vres(vcode):''}</div></div>`}
function vres(code){const c=codes.find(x=>x.code===code.trim().toUpperCase());if(!c&&vwait)return '<div class="res"><div class="hint">Checking...</div></div>';
 if(!c)return `<div class="res"><div class="ico c-bad">${ic('x',34)}</div><h3>Not recognised</h3><div class="hint">No record exists for this code.</div></div>`;
 const s=status(c),m={active:['c-ok','check','Valid'],upcoming:['c-info','clock','Not yet active'],expired:['c-idle','x','Expired'],revoked:['c-bad','ban','Revoked']}[s];
 return `<div class="res"><div class="ico ${m[0]}">${ic(m[1],34)}</div><h3>${m[2]}</h3><dl class="dl"><dt>Name</dt><dd>${esc(c.name)}</dd><dt>Invoice</dt><dd>${esc(c.invoice)}</dd><dt>Valid from</dt><dd>${fmt(c.start)}</dd><dt>Valid until</dt><dd>${fmt(c.end)}</dd></dl></div>`}

function lockView(){return `<div class="card" style="max-width:420px;margin:40px auto;text-align:center"><div class="ico c-brand" style="margin:0 auto 12px;width:60px;height:60px;border-radius:50%">${ic('lock',28)}</div><h2 style="justify-content:center">Integrations are locked</h2><div class="hint" style="margin-bottom:14px">Enter the admin password to manage the cloud connection and plugin settings.</div><div class="row"><input id="lp" type="password" placeholder="Admin password"><button class="btn p" id="lb">Unlock</button></div></div>`}
function integrations(){if(!unlocked)return lockView();return integrationsInner()}
function integrationsInner(){
 return `<div class="row" style="margin-bottom:14px"><button class="btn" id="lk">${ic('lock',16)} Lock section</button><button class="btn" id="cs">Remove sample data</button></div><div class="grid g2" style="margin-top:0"><div class="card"><h2>${ic('cloud')} Firebase (Cloud Firestore)</h2>
 <div class="hint" style="margin:0 0 10px">Paste your Firebase web config as JSON. Codes sync to the <span class="mono">codes</span> collection in real time. Firebase connects when this app is hosted on your own domain or Firebase Hosting; the preview environment blocks outside network calls.</div>
 <textarea id="fbc" placeholder='{"apiKey":"...","authDomain":"...","projectId":"...","appId":"..."}'>${fbcfg?esc(JSON.stringify(fbcfg,null,1)):''}</textarea>
 <div class="row" style="margin-top:10px"><button class="btn p" id="fbon">${ic('cloud',16)} Connect</button><button class="btn" id="fboff">Disconnect</button></div><div class="hint" id="fbs">${db?'Connected':'Not connected. Using local storage.'}</div></div>
 <div class="card"><h2>${ic('plug')} Plugin and API push</h2><div class="hint" style="margin:0">External software can push records three ways:</div>
 <pre>// 1. Firestore: write a doc to codes/{code}
// 2. In-page bridge
QRPass.push({name,invoice,start,end})
// 3. Cross-window message
postMessage({type:'qrpass.push',payload:[...]},'*')</pre>
 <label>Test a push (JSON array)</label><textarea id="pj">[{"name":"Test User","invoice":"INV-API-001","start":"${new Date().toISOString()}","end":"${new Date(Date.now()+7*864e5).toISOString()}"}]</textarea>
 <div class="row" style="margin-top:10px"><button class="btn p" id="pp">Push records</button></div></div></div>`}

function render(){
 $('#nav').innerHTML=NAV.map(n=>`<button class="${n[0]===view?'on':''}" data-go="${n[0]}">${ic(n[2],19)}${n[1]}</button>`).join('');
 $('#crumb').textContent=NAV.find(n=>n[0]===view)[1];
 const f={dashboard,codes:list,create,verify,integrations}[view];
 if(document.activeElement&&['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)&&document.activeElement.id!=='gs')return;
 $('#view').innerHTML=f();
 $('#fbdot').className='dot'+(db?' on':'');$('#fbtxt').textContent=db?'Firebase connected':'Local storage';
}
function go(v){if(v!=='integrations')unlocked=false;view=v;location.hash=v;render()}
function showQR(code,dl){const c=codes.find(x=>x.code===code);if(!c)return;
 const base=PUBLIC_URL||location.href.split('#')[0];const url=base+'#verify-'+c.code;const local=!PUBLIC_URL&&location.protocol==='file:';
 const host=document.createElement('div');new QRCode(host,{text:url,width:240,height:240,correctLevel:QRCode.CorrectLevel.M});
 if(dl){setTimeout(()=>{const cv=host.querySelector('canvas');const o=document.createElement('canvas');o.width=o.height=300;const x=o.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,300,300);x.drawImage(cv,30,30,240,240);const a=document.createElement('a');a.href=o.toDataURL('image/png');a.download=c.code+'.png';a.click()},60);return}
 $('#overlay').innerHTML=`<div class="modal"><div class="mbox"><h2 style="justify-content:center;margin-bottom:2px">${esc(c.name)}</h2><div class="mono">${esc(c.code)}</div><div class="qrbox" id="qh"></div><div style="margin-bottom:6px">${badge(status(c))}</div><div class="hint">${esc(c.invoice)} &middot; ${fmt(c.start)} to ${fmt(c.end)}</div>${local?'<div class="hint" style="color:var(--bad);margin-top:8px">Warning: this QR points to a file on this computer and will not open on phones. Host the app online first.</div>':''}<div class="row" style="justify-content:center;margin-top:14px"><button class="btn p" data-a="dl" data-c="${c.code}">${ic('dl',16)} Download</button><button class="btn" id="mc">Close</button></div></div></div>`;
 $('#qh').appendChild(host)}
function cloudVerify(inc){if(!db||!vcode){vwait=false;return}db.collection('codes').doc(vcode).get().then(d=>{if(d.exists){const x=d.data();upsert({...x,code:vcode,start:toMs(x.start),end:toMs(x.end)},true);if(inc)db.collection('codes').doc(vcode).update({scans:firebase.firestore.FieldValue.increment(1)}).catch(()=>{})}}).catch(()=>{}).finally(()=>{vwait=false;render()})}
function loadJs(u){return new Promise((r,j)=>{const s=document.createElement('script');s.src=u;s.onload=r;s.onerror=j;document.head.appendChild(s)})}
async function fbConnect(cfg){try{const b='https://cdn.jsdelivr.net/npm/firebase@10.12.2/';if(!window.firebase){await loadJs(b+'firebase-app-compat.js');await loadJs(b+'firebase-firestore-compat.js')}
 if(!firebase.apps.length)firebase.initializeApp(cfg);db=firebase.firestore();db.collection('codes').limit(1).get().catch(e=>toast('Firebase: '+(e.code||e.message)));fbcfg=cfg;LS.set('qrpass.fb',cfg);
 codes.filter(c=>c.source!=='sample').forEach(c=>db.collection('codes').doc(c.code).set(c));
 if(view!=='verify')db.collection('codes').onSnapshot(s=>{s.docChanges().forEach(ch=>{const d=ch.doc.data();if(ch.type==='removed')codes=codes.filter(c=>c.code!==ch.doc.id);else upsert({...d,code:ch.doc.id,start:toMs(d.start),end:toMs(d.end),created:d.created||Date.now(),scans:d.scans||0},true)});save();render()});
 if(view==='verify')cloudVerify(true);toast('Firebase connected')}catch(e){db=null;toast('Could not reach Firebase from this environment')}render()}

document.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-a],#rg,#go,#vb,#mc,#fbon,#fboff,#pp,#theme,#lb,#lk,#cs');if(!t)return;
 if(t.dataset.go)return go(t.dataset.go);
 const a=t.dataset.a,c=t.dataset.c;
 if(a==='qr')showQR(c);else if(a==='dl')showQR(c,true);
 else if(a==='rev'){const r=codes.find(x=>x.code===c);upsert({code:c,revoked:!r.revoked});render()}
 else if(a==='del'){if(confirm('Delete this code permanently?')){remove(c);render()}}
 else if(t.id==='rg')$('#c').value=genCode();
 else if(t.id==='mc')$('#overlay').innerHTML='';
 else if(t.id==='go'){try{const r=push({code:$('#c').value.trim().toUpperCase(),name:$('#n').value.trim(),invoice:$('#i').value.trim(),start:$('#s').value,end:$('#e').value,source:'manual'});
  if(codes.filter(x=>x.code===r.code).length>1)throw new Error('Code already exists');view='codes';location.hash='codes';render();showQR(r.code)}catch(x){toast(x.message)}}
 else if(t.id==='vb'){vcode=$('#vc').value.trim().toUpperCase();vwait=!!db;$('#vr').innerHTML=vres(vcode);cloudVerify()}
 else if(t.id==='pp'){try{const arr=[].concat(JSON.parse($('#pj').value));arr.forEach(p=>push({...p,source:'plugin'}));toast(arr.length+' record(s) received');}catch(x){toast(x.message)}}
 else if(t.id==='lb'){tryUnlock()}else if(t.id==='lk'){unlocked=false;render()}else if(t.id==='cs'){codes=codes.filter(c=>c.source!=='sample');save();toast('Sample data removed');render()}else if(t.id==='fbon'){try{fbConnect(JSON.parse($('#fbc').value))}catch(x){toast('Config must be valid JSON')}}
 else if(t.id==='fboff'){db=null;fbcfg=null;LS.set('qrpass.fb',null);toast('Disconnected');render()}
 else if(t.id==='theme'){const d=document.documentElement,dark=getComputedStyle(d).getPropertyValue('--bg').trim()==='#0f1020';d.setAttribute('data-theme',dark?'light':'dark')}});
document.addEventListener('change',e=>{if(e.target.id==='f'){filt=e.target.value;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='vc')$('#vb').click();if(e.key==='Enter'&&e.target.id==='lp')$('#lb').click()});
$('#gs').addEventListener('input',e=>{q=e.target.value;if(view==='dashboard'||view==='codes')$('#view').innerHTML=({dashboard,codes:list})[view]()});
function route(){const h=location.hash.slice(1);
 document.body.classList.toggle('pub',h.startsWith('verify-'));if(h.startsWith('verify-')){vcode=h.slice(7).toUpperCase();const c=codes.find(x=>x.code===vcode);if(c){c.scans=(c.scans||0)+1;save()}view='verify';vwait=!c&&!!fbcfg;if(db)cloudVerify(true)}
 else if(NAV.some(n=>n[0]===h))view=h;if(view!=='integrations')unlocked=false;render()}
window.addEventListener('hashchange',route);
$('#lg').innerHTML=ic('qr',20);$('#sico').innerHTML=ic('search',16);$('#theme').innerHTML=ic('moon',18);
codes=LS.get('qrpass.codes');if(!Array.isArray(codes)){seed()}
fbcfg=EMBED_FB||LS.get('qrpass.fb');route();if(fbcfg)fbConnect(fbcfg);
setInterval(()=>{if(!document.querySelector('.modal')&&['dashboard','codes'].includes(view)&&document.activeElement.id!=='gs')render()},30000);
</script>
</body>
</html>
